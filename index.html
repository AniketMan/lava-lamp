<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Lava Lamp</title>
    <style>
        * { margin: 0; padding: 0; }
        html, body { overflow: hidden; height: 100%; background: #0f0500; }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            image-rendering: auto; /* bilinear upscale for smooth look */
        }
    </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// =============================================================================
// LAVA LAMP - Metaball Renderer with Convection Physics (Canvas 2D)
// =============================================================================
// Uses metaballs: implicit surfaces defined by particle positions.
// Each "wax blob" is a particle with position, velocity, and radius.
// For each pixel, we sum inverse-distance-squared fields from all particles
// and threshold to produce smooth, round shapes that naturally merge when
// close and separate when far apart -- exactly like real lava lamp wax.
//
// Physics: Convection cycle driven by vertical temperature gradient.
//   - Bottom zone: heat source, wax expands, buoyancy pushes blobs UP
//   - Top zone: cooling, wax contracts, gravity pulls blobs DOWN
//   - Result: continuous rise-cool-sink-reheat cycle
//
// Renders at low resolution and CSS-upscales for smooth, soft appearance.
// =============================================================================

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// -----------------------------------------------------------------------------
// Configuration
// -----------------------------------------------------------------------------
const CONFIG = {
    // Render resolution (low for performance, CSS upscales smoothly)
    RENDER_WIDTH:     200,
    RENDER_HEIGHT:    400,
    // Blob physics
    NUM_BLOBS:        12,
    BLOB_MIN_RADIUS:  12,     // in render pixels
    BLOB_MAX_RADIUS:  28,
    BUOYANCY:         0.012,  // upward force at bottom
    COOLING:          0.010,  // downward force at top
    DAMPING:          0.992,  // velocity damping (viscous medium)
    HORIZONTAL_DRIFT: 0.15,   // random horizontal wobble amplitude
    // Metaball rendering
    THRESHOLD:        1.0,    // iso-surface threshold
    EDGE_SOFT:        0.4,    // edge softness range
    // Colors (0-255 range)
    BG_R: 15, BG_G: 5, BG_B: 0,
    PALETTE: [
        { r: 200, g: 55,  b: 10  },  // deep red-orange
        { r: 210, g: 90,  b: 15  },  // orange
        { r: 200, g: 115, b: 20  },  // amber
        { r: 180, g: 65,  b: 10  },  // burnt orange
        { r: 210, g: 140, b: 25  },  // golden
        { r: 170, g: 40,  b: 15  },  // crimson
        { r: 200, g: 100, b: 20  },  // tangerine
    ],
    GLOW_RANGE:       1.8,    // glow extends this far beyond threshold
};

// Set canvas to render resolution (CSS handles display size)
canvas.width = CONFIG.RENDER_WIDTH;
canvas.height = CONFIG.RENDER_HEIGHT;

// Pre-allocate ImageData for pixel manipulation
const imgData = ctx.createImageData(CONFIG.RENDER_WIDTH, CONFIG.RENDER_HEIGHT);
const pixels = imgData.data;

// -----------------------------------------------------------------------------
// Blob particles
// -----------------------------------------------------------------------------
class Blob {
    constructor(startAtBottom) {
        // Position in render-pixel coordinates
        this.x = CONFIG.RENDER_WIDTH * (0.25 + Math.random() * 0.5);
        this.y = startAtBottom
            ? CONFIG.RENDER_HEIGHT * (0.7 + Math.random() * 0.25)
            : CONFIG.RENDER_HEIGHT * Math.random();
        this.vx = 0;
        this.vy = 0;
        this.radius = CONFIG.BLOB_MIN_RADIUS +
                      Math.random() * (CONFIG.BLOB_MAX_RADIUS - CONFIG.BLOB_MIN_RADIUS);
        this.r2 = this.radius * this.radius;  // precomputed radius squared

        // Pick a color from palette
        const c = CONFIG.PALETTE[Math.floor(Math.random() * CONFIG.PALETTE.length)];
        this.cr = c.r;
        this.cg = c.g;
        this.cb = c.b;

        // Per-blob variation
        this.buoyancyMod = 0.7 + Math.random() * 0.6;
        this.phase = Math.random() * Math.PI * 2;
        this.wobbleSpeed = 0.3 + Math.random() * 0.4;
    }

    update(dt, time) {
        const h = CONFIG.RENDER_HEIGHT;
        // Normalized Y: 0 = top, 1 = bottom
        const normalizedY = this.y / h;

        // Temperature: +1 at bottom, -1 at top
        const temperature = normalizedY * 2.0 - 1.0;

        if (temperature > 0) {
            // Bottom half: heated, buoyant -- push UP (negative vy)
            this.vy -= CONFIG.BUOYANCY * temperature * this.buoyancyMod * dt;
        } else {
            // Top half: cooling -- push DOWN (positive vy)
            this.vy += CONFIG.COOLING * Math.abs(temperature) * this.buoyancyMod * dt;
        }

        // Gentle horizontal wobble
        this.phase += this.wobbleSpeed * dt * 0.016;
        this.vx += Math.sin(this.phase) * CONFIG.HORIZONTAL_DRIFT * dt * 0.016;

        // Center-seeking force (keeps blobs in the lamp tube)
        const centerX = CONFIG.RENDER_WIDTH * 0.5;
        this.vx -= (this.x - centerX) * 0.0003 * dt;

        // Viscous damping
        const damp = Math.pow(CONFIG.DAMPING, dt * 0.016);
        this.vx *= damp;
        this.vy *= damp;

        // Integrate
        this.x += this.vx * dt;
        this.y += this.vy * dt;

        // Boundary: soft bounce
        const margin = this.radius * 0.5;
        if (this.y < margin) {
            this.y = margin;
            this.vy = Math.abs(this.vy) * 0.3;
        }
        if (this.y > h - margin) {
            this.y = h - margin;
            this.vy = -Math.abs(this.vy) * 0.3;
        }
        if (this.x < margin) {
            this.x = margin;
            this.vx = Math.abs(this.vx) * 0.2;
        }
        if (this.x > CONFIG.RENDER_WIDTH - margin) {
            this.x = CONFIG.RENDER_WIDTH - margin;
            this.vx = -Math.abs(this.vx) * 0.2;
        }

        // Breathing: slight radius pulse
        this.currentR2 = this.r2 * (1.0 + Math.sin(time * 0.0005 + this.phase) * 0.08);
    }
}

// Create blobs
const blobs = [];
for (let i = 0; i < CONFIG.NUM_BLOBS; i++) {
    blobs.push(new Blob(i < CONFIG.NUM_BLOBS * 0.6));
}

// -----------------------------------------------------------------------------
// Render loop
// -----------------------------------------------------------------------------
let lastTime = 0;

function frame(now) {
    requestAnimationFrame(frame);

    const dt = Math.min(now - lastTime, 50);  // cap at 50ms
    lastTime = now;

    // Update physics
    for (const b of blobs) {
        b.update(dt, now);
    }

    // Render metaballs to pixel buffer
    const w = CONFIG.RENDER_WIDTH;
    const h = CONFIG.RENDER_HEIGHT;
    const threshold = CONFIG.THRESHOLD;
    const edgeSoft = CONFIG.EDGE_SOFT;
    const glowRange = CONFIG.GLOW_RANGE;
    const bgR = CONFIG.BG_R;
    const bgG = CONFIG.BG_G;
    const bgB = CONFIG.BG_B;
    const numBlobs = blobs.length;

    for (let py = 0; py < h; py++) {
        for (let px = 0; px < w; px++) {
            let totalField = 0;
            let weightR = 0, weightG = 0, weightB = 0;
            let totalWeight = 0;

            // Sum metaball contributions
            for (let i = 0; i < numBlobs; i++) {
                const b = blobs[i];
                const dx = px - b.x;
                const dy = py - b.y;
                const dist2 = dx * dx + dy * dy + 1;  // +1 avoids division by zero

                // Field = r^2 / d^2
                const field = b.currentR2 / dist2;
                totalField += field;

                // Color weighting (closer blobs contribute more)
                const cw = field * field;
                weightR += b.cr * cw;
                weightG += b.cg * cw;
                weightB += b.cb * cw;
                totalWeight += cw;
            }

            const idx = (py * w + px) * 4;

            if (totalField > threshold - edgeSoft) {
                // Normalize color
                if (totalWeight > 0) {
                    weightR /= totalWeight;
                    weightG /= totalWeight;
                    weightB /= totalWeight;
                }

                // Smooth edge factor (0 at edge, 1 deep inside)
                let edge;
                if (totalField < threshold) {
                    edge = (totalField - (threshold - edgeSoft)) / edgeSoft;
                } else {
                    edge = 1.0;
                }

                // Depth shading: darker at edge, brighter inside (clamped)
                const depth = Math.min((totalField - threshold + edgeSoft) / (threshold + 1.0), 1.0);
                const shade = 0.45 + depth * 0.45;  // range 0.45 to 0.90

                // Blob color
                let r = weightR * shade;
                let g = weightG * shade;
                let b = weightB * shade;

                // Blend with background at edges
                r = bgR + (r - bgR) * edge;
                g = bgG + (g - bgG) * edge;
                b = bgB + (b - bgB) * edge;

                pixels[idx]     = Math.min(255, r | 0);
                pixels[idx + 1] = Math.min(255, g | 0);
                pixels[idx + 2] = Math.min(255, b | 0);
                pixels[idx + 3] = 255;

            } else if (totalField > threshold / glowRange) {
                // Subtle glow zone
                const glowT = (totalField - threshold / glowRange) /
                               (threshold - edgeSoft - threshold / glowRange);
                const glow = Math.max(0, Math.min(1, glowT)) * 0.25;

                if (totalWeight > 0) {
                    weightR /= totalWeight;
                    weightG /= totalWeight;
                    weightB /= totalWeight;
                }

                pixels[idx]     = Math.min(255, (bgR + weightR * glow * 0.3) | 0);
                pixels[idx + 1] = Math.min(255, (bgG + weightG * glow * 0.3) | 0);
                pixels[idx + 2] = Math.min(255, (bgB + weightB * glow * 0.3) | 0);
                pixels[idx + 3] = 255;

            } else {
                // Background
                pixels[idx]     = bgR;
                pixels[idx + 1] = bgG;
                pixels[idx + 2] = bgB;
                pixels[idx + 3] = 255;
            }
        }
    }

    // Draw to canvas
    ctx.putImageData(imgData, 0, 0);
}

requestAnimationFrame(frame);

// -----------------------------------------------------------------------------
// Mouse/touch interaction: push blobs away from pointer
// -----------------------------------------------------------------------------
function onPointer(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.clientX || (e.touches && e.touches[0].clientX);
    const clientY = e.clientY || (e.touches && e.touches[0].clientY);
    if (clientX === undefined) return;

    // Convert screen coords to render coords
    const px = (clientX / rect.width) * CONFIG.RENDER_WIDTH;
    const py = (clientY / rect.height) * CONFIG.RENDER_HEIGHT;

    for (const b of blobs) {
        const dx = b.x - px;
        const dy = b.y - py;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 40) {
            const force = (40 - dist) * 0.05;
            b.vx += (dx / (dist + 0.1)) * force;
            b.vy += (dy / (dist + 0.1)) * force;
        }
    }
}

canvas.addEventListener('mousemove', onPointer);
canvas.addEventListener('touchmove', (e) => { e.preventDefault(); onPointer(e); }, { passive: false });

</script>
</body>
</html>
